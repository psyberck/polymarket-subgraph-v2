# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
name: polymarket-indexer
description: Polymarket indexer of UserPositions, OrderFilled subgraphs.

# Postgres is primary; ClickHouse mirrors @storage(clickhouse: true) entities
storage:
  postgres: true
  clickhouse: true

contracts:
  # ── CTF Exchange V2 ───────────────────────────────────────────────
  # OrderFilled only; OrdersMatched summarizes the same fills (double-count).
  - name: CTFExchangeV2
    events:
      - event: 'OrderFilled(bytes32 indexed orderHash, address indexed maker, address indexed taker, uint8 side, uint256 tokenId, uint256 makerAmountFilled, uint256 takerAmountFilled, uint256 fee, bytes32 builder, bytes32 metadata)'

  # ── Position lifecycle: standard markets ───────────────────────────
  # Split/merge/redeem must be folded in or cost basis drifts. They are
  # emitted by Gnosis ConditionalTokens; the gen-1 adapter shares the same
  # signatures and is listed too in case events are ever routed through it.
  - name: ConditionalTokens
    events:
      - event: 'ConditionPreparation(bytes32 indexed conditionId, address indexed oracle, bytes32 indexed questionId, uint256 outcomeSlotCount)'
      - event: 'ConditionResolution(bytes32 indexed conditionId, address indexed oracle, bytes32 indexed questionId, uint256 outcomeSlotCount, uint256[] payoutNumerators)'
      - event: 'PositionSplit(address indexed stakeholder, address collateralToken, bytes32 indexed parentCollectionId, bytes32 indexed conditionId, uint256[] partition, uint256 amount)'
      - event: 'PositionsMerge(address indexed stakeholder, address collateralToken, bytes32 indexed parentCollectionId, bytes32 indexed conditionId, uint256[] partition, uint256 amount)'
      - event: 'PayoutRedemption(address indexed redeemer, address indexed collateralToken, bytes32 indexed parentCollectionId, bytes32 conditionId, uint256[] indexSets, uint256 payout)'
      - event: 'TransferSingle(address indexed operator, address indexed from, address indexed to, uint256 id, uint256 value)'
      - event: 'TransferBatch(address indexed operator, address indexed from, address indexed to, uint256[] ids, uint256[] values)'

  # ── Position lifecycle: neg-risk markets ───────────────────────────
  # Still live after v2. Signatures differ from ConditionalTokens, so these
  # need their own handlers; missing them corrupts every neg-risk position.
  - name: NegRiskAdapter
    events:
      - event: 'PositionSplit(address indexed stakeholder, bytes32 indexed conditionId, uint256 amount)'
      - event: 'PositionsMerge(address indexed stakeholder, bytes32 indexed conditionId, uint256 amount)'
      - event: 'PayoutRedemption(address indexed redeemer, bytes32 indexed conditionId, uint256[] amounts, uint256 payout)'
      - event: 'PositionsConverted(address indexed stakeholder, bytes32 indexed marketId, uint256 indexed indexSet, uint256 amount)'
      - event: 'MarketPrepared(bytes32 indexed marketId, address indexed oracle, uint256 feeBips, bytes data)'
      - event: 'QuestionPrepared(bytes32 indexed marketId, bytes32 indexed questionId, uint256 index, bytes data)'
  - name: NegRiskCtfCollateralAdapter
    events:
      - event: 'PositionSplit(address indexed initiator, bytes32 indexed conditionId, uint256 amount)'
        field_selection:
          transaction_fields:
            - hash
      - event: 'PositionsMerged(address indexed initiator, bytes32 indexed conditionId, uint256 amount)'
      - event: 'PositionsConverted(address indexed initiator, bytes32 indexed marketId, uint256 indexed indexSet, uint256 amount, uint256 amountOut)'
        field_selection:
          transaction_fields:
            - hash
      - event: 'PositionsRedeemed(address indexed initiator, bytes32 indexed conditionId, uint256[] amounts, uint256 payout)'

  # ── Standard-market collateral adapter ──────────────────────
  # Its own events cover all wallet<->adapter transfers, so it is booked from these, not from transfers.
  - name: CtfCollateralAdapter
    events:
      - event: 'PositionSplit(address indexed initiator, bytes32 indexed conditionId, uint256 amount)'
      - event: 'gstPositionsMerged(address indexed initiator, bytes32 indexed conditionId, uint256 amount)'
      - event: 'PositionsRedeemed(address indexed initiator, bytes32 indexed conditionId, uint256[] amounts, uint256 payout)'

  # ── Auto-redeemers ─────────────────────────────────────────────────
  # Each CTF pull to a redeemer has one of these naming the wallet in the same
  # tx. Redemption(from, positionId, payout) is skipped: it redeems combo
  # positions on PositionManager, not CTF (see AutoRedeemerMapping.ts).
  - name: AutoRedeemer
    events:
      - event: 'BinaryRedemption(address indexed from, bytes32 indexed conditionId, uint256 payout)'
      - event: 'NegRiskRedemption(address indexed from, bytes32 indexed conditionId, uint256 payout)'

chains:
  - id: 137 # Polygon
    start_block: ${ENVIO_START_BLOCK:-85050370}
    end_block: ${ENVIO_END_BLOCK:-}
    rpc:
      # Upstream is PROXY_UPSTREAM (default Tenderly). Point url straight at
      # an endpoint with real headroom to skip the proxy.
      url: http://127.0.0.1:8546
      for: sync
      initial_block_interval: 500
      interval_ceiling: 1000
      query_timeout_millis: 120000
    contracts:
      - name: CTFExchangeV2
        address:
          - 0xe111180000d2663c0091e4f400237545b87b996b
          - 0xe2222d279d744050d28e00520010520000310f59
          - 0xe2222d002000ba0053cef3375333610f64600036
      - name: ConditionalTokens
        address:
          - 0x4d97dcd97ec945f40cf65f87097ace5ea0476045 # Gnosis CTF — live
          - 0xada100874d00e3331d00f2007a9c336a65009718 # CtfCollateralAdapter gen 1
      - name: NegRiskAdapter
        address:
          - 0xd91e80cf2e7be2e162c6513ced06f1dd0da35296
      - name: NegRiskCtfCollateralAdapter
        address:
          - 0xada2005600dec949baf300f4c6120000bdb6eaab
      - name: CtfCollateralAdapter
        address:
          - 0xada100db00ca00073811820692005400218fce1f
      - name: AutoRedeemer
        address:
          - 0xa1200000d0002264c9a1698e001292d00e1b00af
          - 0xf3cfb6a6ebfeb51876289eb235719eb1c65252b0
